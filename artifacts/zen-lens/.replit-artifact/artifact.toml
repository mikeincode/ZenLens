kind = "mobile"
previewPath = "/"
title = "ZenLens"
version = "1.0.0"
id = "artifacts/zen-lens"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18522

[services.development]
run = "pnpm --filter @workspace/zen-lens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zen-lens", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/zen-lens", "run", "serve" ]

[services.env]
PORT = "18522"
BASE_PATH = "/"
